# AUTO-GENERATED FROM src/schemas/*.ts — DO NOT EDIT BY HAND.
# Regenerated on every `astro dev` / `astro build`.
# Edit the Zod schemas in src/schemas/ (or baseConfig in
# src/lib/generate-config.ts) instead.

backend:
  name: github
  repo: designsystemsinternational/processing-foundation-website
  branch: main
local_backend: true
media_folder: /src/assets/media
public_folder: /src/assets/media
collections:
  - name: people
    label: People
    folder: src/content/people
    create: true
    identifier_field: name
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    fields:
      - name: name
        label: Name
        widget: string
      - name: title
        label: Title
        required: false
        widget: string
      - name: url
        label: Url
        required: false
        widget: string
      - name: roles
        label: Roles
        widget: select
        multiple: true
        options:
          - Staff
          - Board
          - Advisor
          - Mentor
          - Fellow
          - Grantee
          - Alumn
      - name: image
        label: Image
        required: false
        widget: image
      - name: body
        label: Body
        widget: markdown
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    delete: true
    identifier_field: title
    extension: json
    format: json
    summary: '{{title}}'
    nested:
      depth: 100
      subfolders: false
    meta:
      path:
        label: Parent page ("/" for a top-level page)
        widget: page-path
        default: /
    fields:
      - name: title
        label: Title
        widget: string
      - name: slug
        label: Slug
        widget: string
        pattern:
          - ^[^/]+$
          - Slug can't contain a slash
      - name: theme
        label: Theme
        default: default
        widget: select
        options:
          - value: default
            label: Default
          - value: theme-2
            label: Red and Blue
          - value: theme-3
            label: Orange and Purple
          - value: theme-4
            label: Pink and Green
          - value: theme-5
            label: PF Purple
          - value: theme-6
            label: Blue and Orange
      - name: blocks
        label: Blocks
        required: false
        widget: list
        types:
          - name: block1
            label: Block 1
            widget: object
            fields:
              - name: title
                label: Title
                widget: string
              - name: description
                label: Description
                widget: string
              - name: body
                label: Body
                required: false
                widget: markdown
          - name: block2
            label: Block 2
            widget: object
            fields:
              - name: title
                label: Title
                widget: string
              - name: description
                label: Description
                widget: string
          - name: block3
            label: Block 3
            widget: object
            fields:
              - name: title
                label: Title
                widget: string
              - name: description
                label: Description
                widget: string
  - name: blog-posts
    label: Blog Posts
    folder: src/content/blogPosts
    create: true
    delete: true
    identifier_field: title
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    fields:
      - name: title
        label: Title
        pattern:
          - ^.{0,100}$
          - Must be 100 characters or less
        widget: string
      - name: subtitle
        label: Subtitle
        required: false
        pattern:
          - ^.{0,200}$
          - Must be 200 characters or less
        widget: string
      - name: slug
        label: Custom slug
        required: false
        widget: string
      - name: date
        label: Date
        widget: datetime
      - name: author
        label: Author
        widget: relation
        collection: people
        search_fields:
          - name
        value_field: name
        display_fields:
          - name
        multiple: true
        min: 1
        max: 2
      - name: category
        label: Category
        required: false
        widget: relation
        collection: blog-categories
        search_fields:
          - name
        value_field: name
        display_fields:
          - name
      - name: headerImage
        label: Header Image
        required: false
        widget: image
      - name: headerImageCaption
        label: Header Image Caption
        required: false
        widget: markdown
      - name: body
        label: Body
        widget: markdown
  - name: blog-categories
    label: Blog Categories
    folder: src/content/blogCategories
    create: true
    delete: true
    identifier_field: name
    extension: json
    format: json
    fields:
      - name: name
        label: Name
        widget: string
      - name: slug
        label: Custom slug
        required: false
        widget: string
      - name: description
        label: Description
        required: false
        widget: text
  - name: fellowships
    label: Fellowships
    folder: src/content/fellowships
    create: true
    delete: true
    extension: md
    nested:
      depth: 3
    meta:
      path:
        label: Path
        widget: string
        index_file: index
    summary: '{{fields.year}} — {{fields.fellows.0}}{{title | ternary('': '', '''')}}{{title}}'
    media_folder: ''
    public_folder: ''
    fields:
      - name: year
        label: Year
        widget: relation
        collection: fellowship-years
        search_fields:
          - year
        value_field: year
        display_fields:
          - year
      - name: title
        label: Title
        required: false
        pattern:
          - ^.{0,200}$
          - Must be 200 characters or less
        widget: string
        hint: Optional. Falls back to the fellows' names when left blank.
      - name: fellows
        label: Fellows
        widget: relation
        collection: people
        search_fields:
          - name
        value_field: name
        display_fields:
          - name
        multiple: true
        min: 1
      - name: mentors
        label: Mentors
        required: false
        widget: relation
        collection: people
        search_fields:
          - name
        value_field: name
        display_fields:
          - name
        multiple: true
      - name: image
        label: Image
        required: false
        widget: image
      - name: projectUrl
        label: Project URL
        required: false
        widget: string
        hint: The project itself — repository, website, or live sketch.
      - name: blogPosts
        label: Related Blog Posts
        required: false
        widget: relation
        collection: blog-posts
        search_fields:
          - title
        value_field: title
        display_fields:
          - title
        multiple: true
      - name: body
        label: Project Description
        widget: markdown
  - name: fellowship-years
    label: Fellowship Years
    folder: src/content/fellowships
    create: true
    delete: true
    identifier_field: year
    extension: json
    format: json
    path: '{{fields.year}}/index'
    fields:
      - name: year
        label: Year
        widget: string
        pattern:
          - ^\d{4}$
          - Must be a four-digit year
      - name: title
        label: Title
        required: false
        pattern:
          - ^.{0,200}$
          - Must be 200 characters or less
        widget: string
      - name: description
        label: Description
        required: false
        widget: markdown
