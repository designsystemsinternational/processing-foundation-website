<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rotating Square</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* p5 writes the createCanvas() size inline on the element, so only
         !important lets the canvas follow the frame. */
      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.0.3/lib/p5.min.js"></script>
  </head>
  <body>
    <script src="sketch.js"></script>
  </body>
</html>
